apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aria-opensearch-secrets
  labels: {app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  provider: openbao
  secretObjects:
    - secretName: aria-opensearch-runtime
      type: Opaque
      data:
        - objectName: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  parameters:
    roleName: aria-opensearch
    baoAddress: OPENBAO_URL_REPLACE_ME
    objects: |
      - objectName: OPENSEARCH_INITIAL_ADMIN_PASSWORD
        secretPath: secret/data/aria/infrastructure/opensearch
        secretKey: OPENSEARCH_INITIAL_ADMIN_PASSWORD
