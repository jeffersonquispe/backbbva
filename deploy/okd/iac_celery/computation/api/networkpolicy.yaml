apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [nginx, aria-worker-test, aria-worker-simulator, mcp]}]}
      ports: [{protocol: TCP, port: 8000}]
