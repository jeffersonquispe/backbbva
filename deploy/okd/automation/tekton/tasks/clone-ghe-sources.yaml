apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aria-clone-ghe-sources-v1
  namespace: aria-genai-dev
spec:
  params:
    - name: backend-repository
      type: string
      default: https://bbva.ghe.com/free/aria-agente-prevencion-fraude-backend.git
    - name: frontend-repository
      type: string
      default: https://bbva.ghe.com/free/aria-agente-prevencion-fraude-frontend.git
    - name: backend-branch
      type: string
      default: main
    - name: frontend-branch
      type: string
      default: main
    - name: github-user
      type: string
      default: ''
    - name: github-token
      type: string
      default: ''
  results:
    - name: backend-commit
      type: string
    - name: frontend-commit
      type: string
    - name: run-dir
      type: string
  workspaces:
    - name: staging
  steps:
    - name: clone-with-form-credentials
      image: alpine/git:v2.47.2
      computeResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: BACKEND_REPOSITORY
          value: $(params.backend-repository)
        - name: FRONTEND_REPOSITORY
          value: $(params.frontend-repository)
        - name: BACKEND_BRANCH
          value: $(params.backend-branch)
        - name: FRONTEND_BRANCH
          value: $(params.frontend-branch)
        - name: GITHUB_USER
          value: $(params.github-user)
        - name: GITHUB_TOKEN
          value: $(params.github-token)
        - name: RUN_ID
          value: $(context.taskRun.uid)
      script: |
        #!/bin/sh
        set -eu
        export GIT_TERMINAL_PROMPT=0
        if [ -z "$GITHUB_USER" ] || [ -z "$GITHUB_TOKEN" ]; then
          echo 'Completa los campos GitHub user y GitHub classic token del Pipeline.'
          exit 2
        fi
        askpass=$(mktemp /tmp/aria-git-askpass.XXXXXX)
        cat > "$askpass" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *sername*) printf '%s\n' "$GITHUB_USER" ;;
          *) printf '%s\n' "$GITHUB_TOKEN" ;;
        esac
        ASKPASS
        chmod 700 "$askpass"
        trap 'rm -f "$askpass"; unset GITHUB_TOKEN' EXIT
        export GIT_ASKPASS="$askpass"
        case "$BACKEND_REPOSITORY $FRONTEND_REPOSITORY" in
          *'@'*|*'?'*|*'#'*) echo 'Git URLs must not contain credentials or query data'; exit 2 ;;
        esac
        case "$BACKEND_REPOSITORY" in https://bbva.ghe.com/*) ;; *) echo 'backend source must use the configured GitHub Enterprise host'; exit 2 ;; esac
        case "$FRONTEND_REPOSITORY" in https://bbva.ghe.com/*) ;; *) echo 'frontend source must use the configured GitHub Enterprise host'; exit 2 ;; esac
        git check-ref-format --branch "$BACKEND_BRANCH" >/dev/null
        git check-ref-format --branch "$FRONTEND_BRANCH" >/dev/null
        root='$(workspaces.staging.path)'
        run_dir="sources/$RUN_ID"
        mkdir -p "$root/$run_dir/diffs"
        clone_or_update() {
          remote="$1"; branch="$2"; destination="$3"
          if [ -d "$destination/.git" ]; then
            git -C "$destination" fetch --quiet --prune origin "$branch"
            git -C "$destination" checkout --quiet --detach FETCH_HEAD
          else
            temporary=$(mktemp -d "$root/sources/.clone.XXXXXX")
            git clone --quiet --single-branch --branch "$branch" "$remote" "$temporary/repo"
            mkdir -p "$(dirname "$destination")"
            mv "$temporary/repo" "$destination"
            rmdir "$temporary"
          fi
        }
        clone_or_update "$BACKEND_REPOSITORY" "$BACKEND_BRANCH" "$root/$run_dir/backend"
        clone_or_update "$FRONTEND_REPOSITORY" "$FRONTEND_BRANCH" "$root/$run_dir/frontend"
        backend_commit=$(git -C "$root/$run_dir/backend" rev-parse HEAD)
        frontend_commit=$(git -C "$root/$run_dir/frontend" rev-parse HEAD)
        mkdir -p "$root/state/published"
        for baseline in "$root"/state/published/*.commit; do
          [ -f "$baseline" ] || continue
          service=$(basename "$baseline" .commit)
          repo="$root/$run_dir/backend"
          [ "$service" = frontend ] && repo="$root/$run_dir/frontend"
          previous=$(cat "$baseline")
          if git -C "$repo" cat-file -e "$previous^{commit}" 2>/dev/null; then
            git -C "$repo" diff --name-only "$previous" HEAD > "$root/$run_dir/diffs/$service.txt" || printf '*\n' > "$root/$run_dir/diffs/$service.txt"
          else
            printf '*\n' > "$root/$run_dir/diffs/$service.txt"
          fi
        done
        printf '%s' "$backend_commit" > '$(results.backend-commit.path)'
        printf '%s' "$frontend_commit" > '$(results.frontend-commit.path)'
        printf '%s' "$run_dir" > '$(results.run-dir.path)'
