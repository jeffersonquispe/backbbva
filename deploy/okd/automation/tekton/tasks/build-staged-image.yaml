apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aria-build-staged-image-v2
  namespace: aria-genai-dev
spec:
  podTemplate:
    nodeSelector:
      kubernetes.io/arch: amd64
  params:
    - {name: service, type: string}
    - {name: should-build, type: string, default: 'true'}
    - {name: image-repository, type: string}
    - {name: image-tag, type: string, default: ''}
    - {name: source-commit, type: string}
    - {name: source-dir, type: string}
    - {name: dockerfile, type: string}
    - {name: context-dir, type: string}
    - {name: source-branch, type: string}
    - {name: target-platform, type: string, default: linux/amd64}
  workspaces:
    - name: staging
    - name: registry-auth
  steps:
    - name: build-and-save-without-push
      image: ghcr.io/osscontainertools/kaniko:v1.28.5-debug
      computeResources:
        requests: {cpu: '1', memory: 2Gi}
        limits: {cpu: '2', memory: 4Gi}
      env:
        - {name: SERVICE, value: $(params.service)}
        - {name: SHOULD_BUILD, value: $(params.should-build)}
        - {name: IMAGE_REPOSITORY, value: $(params.image-repository)}
        - {name: IMAGE_TAG, value: $(params.image-tag)}
        - {name: SOURCE_COMMIT, value: $(params.source-commit)}
        - {name: SOURCE_DIR, value: $(params.source-dir)}
        - {name: DOCKERFILE, value: $(params.dockerfile)}
        - {name: CONTEXT_DIR, value: $(params.context-dir)}
        - {name: SOURCE_BRANCH, value: $(params.source-branch)}
        - {name: TARGET_PLATFORM, value: $(params.target-platform)}
      script: |
        #!/busybox/sh
        set -eu
        if [ "$SHOULD_BUILD" != true ]; then
          echo "No source changes require a build for $SERVICE"; exit 0
        fi
        [ "$TARGET_PLATFORM" = linux/amd64 ] && [ "$(uname -m)" = x86_64 ] || {
          echo "build node architecture $(uname -m) does not match required linux/amd64"; exit 2;
        }
        root='$(workspaces.staging.path)'
        service="$SERVICE"; commit="$SOURCE_COMMIT"; tag="${IMAGE_TAG:-$SOURCE_COMMIT}"
        printf '%s\n' "$service" | grep -Eq '^[a-z0-9][a-z0-9-]*$' || { echo 'invalid service'; exit 2; }
        printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40,64}$' || { echo 'invalid source commit'; exit 2; }
        printf '%s\n' "$tag" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || { echo 'invalid image tag'; exit 2; }
        printf '%s\n' "$IMAGE_REPOSITORY" | grep -Eq '^artifactory\.globaldevtools\.bbva\.com:443/co-genai-public-cloud-docker-local/aria-genai/[A-Za-z0-9._/-]+$' || { echo 'invalid image repository'; exit 2; }
        target="${IMAGE_REPOSITORY}:${tag}"
        context="$root/$SOURCE_DIR/$CONTEXT_DIR"
        dockerfile="$root/$SOURCE_DIR/$DOCKERFILE"
        [ -d "$context" ] && [ -f "$dockerfile" ] || { echo 'cloned context or Dockerfile is missing'; exit 2; }
        auth='$(workspaces.registry-auth.path)/.dockerconfigjson'
        [ -r "$auth" ] || { echo 'registry auth config is missing'; exit 2; }
        user=$(grep -m1 -o '"username"[[:space:]]*:[[:space:]]*"[^"]*"' "$auth" | sed -E 's/.*"([^"]*)"$/\1/' || true)
        password=$(grep -m1 -o '"password"[[:space:]]*:[[:space:]]*"[^"]*"' "$auth" | sed -E 's/.*"([^"]*)"$/\1/' || true)
        if [ -z "$user" ] || [ -z "$password" ]; then
          encoded=$(grep -m1 -o '"auth"[[:space:]]*:[[:space:]]*"[^"]*"' "$auth" | sed -E 's/.*"([^"]*)"$/\1/' || true)
          decoded=$(printf '%s' "$encoded" | base64 -d 2>/dev/null || true)
          user="${decoded%%:*}"; password="${decoded#*:}"
        fi
        [ -n "$user" ] && [ -n "$password" ] || { echo 'artifactory-auth must contain docker credentials'; exit 2; }
        umask 077
        secret_dir=$(mktemp -d /tmp/aria-build-auth.XXXXXX)
        export HOME="$(mktemp -d /tmp/aria-build-home.XXXXXX)"
        export DOCKER_CONFIG="$HOME/.docker"
        trap 'rm -rf "$secret_dir" "$HOME"' EXIT
        mkdir -p "$DOCKER_CONFIG"
        cp "$auth" "$DOCKER_CONFIG/config.json"
        chmod 600 "$DOCKER_CONFIG/config.json"
        printf '%s' "$user" > "$secret_dir/user"; printf '%s' "$password" > "$secret_dir/password"
        artifact_dir="$root/images"; mkdir -p "$artifact_dir"
        platform_slug="${TARGET_PLATFORM#linux/}"
        artifact="$artifact_dir/${service}-${commit}-${platform_slug}.tar"
        marker="$artifact.meta"
        if [ -s "$artifact" ] && [ -s "$artifact.sha256" ] && [ -s "$marker" ]; then
          (cd "$artifact_dir" && sha256sum -c "${service}-${commit}-${platform_slug}.tar.sha256")
          IFS="$(printf '\t')" read -r old_service old_commit old_target old_status old_digest old_dir old_branch old_platform < "$marker"
          [ "$old_service" = "$service" ] && [ "$old_commit" = "$commit" ] && [ "$old_target" = "$target" ] && [ "$old_platform" = "$TARGET_PLATFORM" ] || { echo 'immutable staged metadata conflicts'; exit 3; }
          echo 'verified staged artifact already exists; build skipped'; exit 0
        fi
        run_id='$(context.taskRun.uid)'
        tempdir="$artifact_dir/.${service}-${commit}-${run_id}.work"
        [ ! -e "$tempdir" ] || { echo 'temporary artifact path already exists'; exit 3; }
        mkdir "$tempdir"
        /kaniko/executor \
          --context="dir://$context" \
          --dockerfile="$dockerfile" \
          --destination="$target" \
          --tar-path="$tempdir/image.tar" \
          --no-push --no-push-cache --skip-push-permission-check \
          --image-download-retry=3 \
          --secret="id=artifactory_user,src=$secret_dir/user" \
          --secret="id=artifactory_password,src=$secret_dir/password" \
          --build-arg=GENAI_ENVIRONMENT=dev \
          --verbosity=info
        [ -s "$tempdir/image.tar" ] || { echo 'builder did not produce an image archive'; exit 1; }
        checksum=$(sha256sum "$tempdir/image.tar" | awk '{print $1}')
        mv "$tempdir/image.tar" "$artifact"; rmdir "$tempdir"
        printf '%s  %s\n' "$checksum" "${service}-${commit}-${platform_slug}.tar" > "$artifact.sha256.tmp"
        mv "$artifact.sha256.tmp" "$artifact.sha256"
        printf '%s\t%s\t%s\tpending\t-\t%s\t%s\t%s\n' "$service" "$commit" "$target" "$SOURCE_DIR" "$SOURCE_BRANCH" "$TARGET_PLATFORM" > "$marker.tmp"
        mv "$marker.tmp" "$marker"
