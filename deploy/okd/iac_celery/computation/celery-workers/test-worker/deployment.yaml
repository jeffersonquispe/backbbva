apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-worker
  labels:
    app.kubernetes.io/name: test-worker
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: test-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: test-worker, app.kubernetes.io/component: celery-worker, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-test-worker
      containers:
        - name: test-worker
          image: REGISTRY_REPLACE_ME/aria-worker:IMAGE_TAG_REPLACE_ME
          command: [celery, -A, src.infrastructure.entrypoint.worker.celery.celery_app:app, worker, --loglevel=INFO, -Q, test]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom:
            - configMapRef: {name: aria-test-worker-config}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aria-test-worker-runtime, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-test-worker-runtime, key: AWS_SECRET_ACCESS_KEY}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-test-worker-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-test-worker-runtime, key: DYNAMO_SECRET_KEY}}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-test-worker-runtime, key: OBJECT_STORAGE_ACCESS_KEY}}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-test-worker-runtime, key: OBJECT_STORAGE_SECRET_KEY}}
          volumeMounts: [{name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true}]
      volumes:
        - name: secrets-store
          csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: aria-test-worker-secrets}}
