apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-worker-test
  labels:
    app.kubernetes.io/name: aria-worker-test
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: aria-workers
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: aria-worker-test}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aria-worker-test, app.kubernetes.io/component: celery-worker, app.kubernetes.io/part-of: aria-workers}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-worker-test
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: aria-worker-test
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-worker:5571f9f5641747ac86223d8723c8b14923a3d4c5
          command: [celery, -A, src.infrastructure.entrypoint.worker.celery.celery_app:app, worker, --loglevel=INFO, --concurrency=1, -Q, test]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "2", memory: 4Gi}}
          envFrom:
            - configMapRef: {name: aria-worker-test-config}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: AWS_SECRET_ACCESS_KEY}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: DYNAMO_SECRET_KEY}}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: OBJECT_STORAGE_ACCESS_KEY}}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: OBJECT_STORAGE_SECRET_KEY}}
            - name: OPENSEARCH_USERNAME
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: OPENSEARCH_USERNAME}}
            - name: OPENSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: OPENSEARCH_PASSWORD}}
            - name: OPENAI_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-test-runtime, key: OPENAI_KEY}}
