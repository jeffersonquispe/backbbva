apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: redis}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [api, aria-worker-main, aria-worker-training, aria-worker-test, aria-worker-simulator-alerts, aria-worker-scheduler, aria-worker-simulator]}]}
      ports: [{protocol: TCP, port: 6379}]
