apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: nginx}}
  template:
    metadata: {labels: {app.kubernetes.io/name: nginx, app.kubernetes.io/component: proxy, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-nginx
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{name: http, containerPort: 8080}]
          env: [{name: TZ, value: America/Bogota}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
      volumes: [{name: config, configMap: {name: aria-nginx-config}}]
