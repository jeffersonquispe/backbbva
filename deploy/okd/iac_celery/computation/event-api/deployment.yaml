apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-api
  labels: {app.kubernetes.io/name: event-api, app.kubernetes.io/component: event-api, app.kubernetes.io/part-of: aria-main-services, app.kubernetes.io/managed-by: argocd}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: event-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: event-api, app.kubernetes.io/component: event-api, app.kubernetes.io/part-of: aria-main-services}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-event-api
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: event-api
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-event-api:latest
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          envFrom:
            - configMapRef: {name: aria-event-api-config}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
