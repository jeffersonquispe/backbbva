apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aria-worker-main
  labels: {app.kubernetes.io/name: aria-worker-main, app.kubernetes.io/part-of: aria-workers, app.kubernetes.io/managed-by: argocd}
spec:
  scaleTargetRef:
    name: aria-worker-main
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 0
  maxReplicaCount: 8
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: default
        listLength: "5"
        databaseIndex: "0"
