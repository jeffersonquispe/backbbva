apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: traces
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: tempo}}
  template:
    metadata: {labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/component: traces, app.kubernetes.io/part-of: aria-observability}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-tempo
      containers:
        - name: tempo
          image: docker.io/grafana/tempo:2.6.1
          args: [-config.file=/etc/tempo/tempo.yaml, -config.expand-env=true]
          ports: [{name: http, containerPort: 3200}, {name: otlp-grpc, containerPort: 4317}, {name: otlp-http, containerPort: 4318}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          env:
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-observability-minio-runtime, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-observability-minio-runtime, key: S3_SECRET_KEY}}
          volumeMounts:
            - {name: config, mountPath: /etc/tempo, readOnly: true}
            - {name: data, mountPath: /var/tempo}
          startupProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 20, failureThreshold: 6}
      volumes:
        - {name: config, configMap: {name: aria-tempo-config}}
        - {name: data, persistentVolumeClaim: {claimName: tempo-data}}
