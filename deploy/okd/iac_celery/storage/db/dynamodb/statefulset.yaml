apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dynamodb
  labels: {app.kubernetes.io/name: dynamodb, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria-storage, app.kubernetes.io/managed-by: argocd}
spec:
  serviceName: dynamodb
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: dynamodb}}
  template:
    metadata: {labels: {app.kubernetes.io/name: dynamodb, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria-storage}}
    spec:
      serviceAccountName: aria-dynamodb
      containers:
        - name: dynamodb
          image: docker.io/localstack/localstack:3.0
          ports: [{name: dynamodb, containerPort: 4566}]
          envFrom: [{configMapRef: {name: aria-dynamodb-config}}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/localstack}]
          startupProbe: {tcpSocket: {port: dynamodb}, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: dynamodb}, periodSeconds: 10, failureThreshold: 6}
          livenessProbe: {tcpSocket: {port: dynamodb}, periodSeconds: 30}
      volumes: [{name: data, persistentVolumeClaim: {claimName: dynamodb-data}}]
