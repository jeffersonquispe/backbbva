apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: metrics, app.kubernetes.io/part-of: aria-observability}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-prometheus
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.0.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.enable-otlp-receiver
          ports: [{name: http, containerPort: 9090}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          startupProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, periodSeconds: 20, failureThreshold: 6}
      volumes:
        - {name: config, configMap: {name: aria-prometheus-config}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus-data}}
