apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: api, app.kubernetes.io/component: api, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-api
      containers:
        - name: api
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-api:latest
          ports: [{name: http, containerPort: 8000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom:
            - configMapRef: {name: aria-api-config}
          env:
            - name: AUTH_JWT_SECRET
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: AUTH_JWT_SECRET}}
            - name: AUTH_BOOTSTRAP_TOKEN
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: AUTH_BOOTSTRAP_TOKEN}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: AWS_SECRET_ACCESS_KEY}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: DYNAMO_SECRET_KEY}}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: OBJECT_STORAGE_ACCESS_KEY}}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: OBJECT_STORAGE_SECRET_KEY}}
            - name: OPENSEARCH_USERNAME
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: OPENSEARCH_USERNAME}}
            - name: OPENSEARCH_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: OPENSEARCH_PASSWORD}}
            - name: OPENAI_KEY
              valueFrom: {secretKeyRef: {name: aria-api-runtime, key: OPENAI_KEY}}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 20}
