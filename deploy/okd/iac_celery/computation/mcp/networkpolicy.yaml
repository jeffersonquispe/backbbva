apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-ingress
  labels: {app.kubernetes.io/name: mcp, app.kubernetes.io/part-of: aria-main-services, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: mcp}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [aria-worker-main, aria-worker-test, aria-worker-simulator-alerts, aria-agent-worker]}]}
      ports: [{protocol: TCP, port: 8100}]
