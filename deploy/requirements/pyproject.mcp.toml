# Poetry pyproject.toml for the FastMCP model-serving service.
#
# Deliberately a THIRD independent Poetry project, alongside pyproject.toml
# (API) and pyproject.worker.toml (Celery worker) - an explicit exception to
# the root CLAUDE.md's "two separate poetry projects" rule, agreed on when
# this service was scoped: it needs the ML inference stack (xgboost/sklearn/
# pandas/joblib) that the API doesn't, runs as neither FastAPI nor
# Celery, and reuses only src/application + parts of
# src/infrastructure/workflows/celery/model_training.py and the DynamoDB/
# MinIO adapters - not the full API or worker dependency surface.

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aria-mcp"
version = "0.1.0"
description = "FastMCP model-serving service for the novel massive fraud agent for BBVA company"
readme = "README.md"
authors = [
  "BBVA: <carlosdavid.rojas@bbva.com>"
]
license = ""
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12"
setuptools = "78.1.1"

fastmcp = "2.10.6"
boto3 = "1.40.38"
botocore = "1.40.38"
pydantic = "2.11.9"
pydantic-settings = "2.11.0"

xgboost = "2.1.3"
scikit-learn = "1.5.2"
pandas = "2.2.3"
numpy = "1.26.4"
joblib = "1.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.6"
pytest-cov = "4.1.0"
pytest-env = "1.0.1"
black = "24.4.2"
isort = "5.13.2"
flake8 = "7.0.0"
flake8-pyproject = "1.2.3"
pyproject-autoflake = "1.0.2"
ruff = "0.8.4"
vulture = "2.16.0"

[tool.vulture]
paths = ["src"]
exclude = ["*/__pycache__/*", "*/.venv/*"]
min_confidence = 80
sort_by_size = true
