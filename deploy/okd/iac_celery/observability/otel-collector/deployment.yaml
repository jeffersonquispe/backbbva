apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: otel-collector}}
  template:
    metadata: {labels: {app.kubernetes.io/name: otel-collector, app.kubernetes.io/component: telemetry, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-otel-collector
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: otel-collector
          # AWS Distro for OpenTelemetry Collector, pulled through BBVA
          # Artifactory's public.ecr.aws remote (same remote as the Python base
          # images in deploy/local/docker/Dockerfile.*.okd). Upstream
          # otel/opentelemetry-collector-contrib is not on public ECR.
          image: artifactory.globaldevtools.bbva.com:443/public.ecr.aws-remote/aws-observability/aws-otel-collector:v0.43.2
          args: [--config=/etc/otel-collector/collector.yaml]
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: health, containerPort: 13133}
          env:
            - name: OTLP_UPSTREAM_ENDPOINT
              valueFrom: {configMapKeyRef: {name: aria-otel-collector-config, key: OTLP_UPSTREAM_ENDPOINT}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: config, mountPath: /etc/otel-collector, readOnly: true}]
          startupProbe: {httpGet: {path: /, port: health}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: health}, periodSeconds: 20}
      volumes:
        - name: config
          configMap:
            name: aria-otel-collector-config
            items: [{key: collector.yaml, path: collector.yaml}]
