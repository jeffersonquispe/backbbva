apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-nginx-config
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: aria-main-services
    app.kubernetes.io/managed-by: argocd
data:
  nginx.conf: |
    # This image runs without root privileges (including arbitrary OKD UIDs).
    # /run is not writable in that context, so keep the PID in /tmp.
    pid /tmp/nginx.pid;
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      client_max_body_size 10g;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      server {
        listen 8080;
        location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
        location = /health { proxy_pass http://api:8000/health; }
        location / { proxy_intercept_errors on; error_page 404 = /index.html; proxy_pass http://frontend:8080; proxy_set_header Host $host; }
        error_page 413 = @too_large;
        location @too_large { default_type application/json; return 413 '{"detail":"Upload exceeds the 10 GB limit"}'; }
      }
    }
