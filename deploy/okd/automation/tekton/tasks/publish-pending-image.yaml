apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aria-publish-pending-image-v2
  namespace: aria-genai-dev
spec:
  params:
    - {name: service, type: string}
  workspaces:
    - name: staging
    - name: registry-auth
  steps:
    - name: retry-publish-and-verify
      image: quay.io/skopeo/stable:v1.18.0
      computeResources:
        requests: {cpu: 100m, memory: 256Mi}
        limits: {cpu: 500m, memory: 512Mi}
      env:
        - {name: SERVICE, value: $(params.service)}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        root='$(workspaces.staging.path)'; service="$SERVICE"
        [[ "$service" =~ ^[a-z0-9][a-z0-9-]*$ ]] || exit 2
        auth='$(workspaces.registry-auth.path)/.dockerconfigjson'
        [[ -r "$auth" ]] || { echo 'registry auth config is missing'; exit 2; }
        found=false
        for marker in "$root"/images/"${service}-"*.tar.meta; do
          [[ -f "$marker" ]] || continue
          IFS=$'\t' read -r stored_service commit target status digest source_dir source_branch target_platform < "$marker"
          [[ "$status" = pending ]] || continue
          found=true
          artifact="${marker%.meta}"
          (cd "$root/images" && sha256sum -c "$(basename "$artifact").sha256")
          [[ "$stored_service" = "$service" && "$commit" =~ ^[0-9a-f]{40,64}$ ]] || { echo 'invalid artifact metadata'; exit 2; }
          [[ "$target_platform" = linux/amd64 ]] || { echo 'staged artifact has missing or unsupported platform metadata; refusing publish'; exit 3; }
          [[ "$target" =~ ^artifactory\.globaldevtools\.bbva\.com:443/co-genai-public-cloud-docker-local/aria-genai/[A-Za-z0-9._/-]+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'destination outside managed registry path'; exit 2; }
          source="docker-archive:$artifact"
          actual_platform=$(skopeo inspect --format '{{.Os}}/{{.Architecture}}' "$source")
          [[ "$actual_platform" = "$target_platform" ]] || { echo "artifact platform $actual_platform does not match required $target_platform"; exit 3; }
          manifest=$(skopeo inspect --raw "$source")
          expected="sha256:$(printf '%s' "$manifest" | sha256sum | awk '{print $1}')"
          remote=$(skopeo inspect --tls-verify=true --authfile "$auth" --format '{{.Digest}}' "docker://$target" 2>/tmp/inspect.err || true)
          if [[ -n "$remote" ]]; then
            [[ "$remote" = "$expected" ]] || { echo 'immutable tag already exists with different content'; exit 3; }
          else
            attempt=1
            while ! skopeo copy --tls-verify=true --authfile "$auth" --retry-times 0 --preserve-digests "$source" "docker://$target" 2>/tmp/copy.err; do
              if grep -Eiq 'unauthorized|denied|forbidden|authentication|invalid username' /tmp/copy.err; then
                echo 'permanent registry authentication/permission error'; exit 4
              fi
              if [[ "$attempt" -ge 3 ]]; then tail -c 500 /tmp/copy.err; exit 1; fi
              sleep "$((attempt == 1 ? 10 : 30))"; attempt=$((attempt + 1))
            done
            remote=$(skopeo inspect --tls-verify=true --authfile "$auth" --format '{{.Digest}}' "docker://$target")
            [[ "$remote" = "$expected" ]] || { echo 'registry digest differs from staged manifest'; exit 3; }
          fi
          remote_platform=$(skopeo inspect --tls-verify=true --authfile "$auth" --format '{{.Os}}/{{.Architecture}}' "docker://$target")
          [[ "$remote_platform" = "$target_platform" ]] || { echo "published platform $remote_platform does not match required $target_platform"; exit 3; }
          printf '%s\t%s\t%s\tpublished\t%s\t%s\t%s\t%s\n' "$service" "$commit" "$target" "$expected" "$source_dir" "$source_branch" "$target_platform" > "$marker.tmp"
          mv "$marker.tmp" "$marker"
          mkdir -p "$root/state/published"
          printf '%s' "$commit" > "$root/state/published/${service}.commit.tmp"
          mv "$root/state/published/${service}.commit.tmp" "$root/state/published/${service}.commit"
          echo "published and verified $target $expected"
        done
        [[ "$found" = true ]] || echo "no pending artifacts for $service"
