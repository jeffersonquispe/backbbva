apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: opensearch
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: opensearch}}
  template:
    metadata: {labels: {app.kubernetes.io/name: opensearch, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: opensearch-sa
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: opensearch
          image: docker.io/opensearchproject/opensearch:2.19.1
          command: [/bin/bash, /usr/share/opensearch/opensearch-docker-entrypoint.sh]
          args: [-Ediscovery.type=single-node]
          ports: [{name: http, containerPort: 9200}]
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom: [{configMapRef: {name: aria-opensearch-config}}]
          env:
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-opensearch-runtime, key: OPENSEARCH_INITIAL_ADMIN_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: opensearch-data}}
