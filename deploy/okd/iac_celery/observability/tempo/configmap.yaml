apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-tempo-config
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/component: traces
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 48h

    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo
          endpoint: observability-minio:9000
          access_key: ${S3_ACCESS_KEY}
          secret_key: ${S3_SECRET_KEY}
          insecure: true
          forcepathstyle: true
