services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: aria-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-observability}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-observability}
    ports:
      - "${LOCAL_MINIO_API_PORT:-9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - aria-observability-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: aria-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-observability}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-observability}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/tempo &&
      mc mb --ignore-existing local/loki
      "
    networks:
      - aria-observability-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: aria-otel-collector
    command: ["--config=/etc/otel-collector/collector.yaml"]
    volumes:
      - ./otel-collector/collector.yaml:/etc/otel-collector/collector.yaml:ro
    ports:
      - "${LOCAL_OTEL_GRPC_PORT:-4317}:4317"
      - "${LOCAL_OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - aria-observability-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: aria-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-observability}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-observability}
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - aria-observability-net

  loki:
    image: grafana/loki:3.3.2
    container_name: aria-loki
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-observability}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-observability}
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - aria-observability-net

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: aria-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${LOCAL_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - aria-observability-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: aria-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${LOCAL_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - aria-observability-net

networks:
  aria-observability-net:
    driver: bridge

volumes:
  minio-data:
