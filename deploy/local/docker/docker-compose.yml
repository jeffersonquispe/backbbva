services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: aria-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    user: root
    ports:
      - "${LOCAL_DYNAMODB_PORT:-8002}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - aria-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: aria-redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.api
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-api:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-api
    ports:
      - "${LOCAL_API_PORT:-8000}:8000"
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-api}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      COMPONENT_DESCRIPTION: ${COMPONENT_DESCRIPTION:-Transactional API}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_NAME: ${GENAI_NAME:-aria-api}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      ASYNC_EXECUTOR_BACKEND: ${ASYNC_EXECUTOR_BACKEND:-celery}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aria-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.worker
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-worker:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-worker}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      COMPONENT_DESCRIPTION: ${COMPONENT_DESCRIPTION:-Async worker}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_NAME: ${GENAI_NAME:-aria-worker}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - aria-net

networks:
  aria-net:
    driver: bridge

volumes:
  dynamodb-data:
