apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-minio-ingress
  labels: {app.kubernetes.io/name: observability-minio, app.kubernetes.io/part-of: aria-observability, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: observability-minio}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [tempo,loki,observability-minio-init]}]}
      ports: [{protocol: TCP, port: 9000}]
