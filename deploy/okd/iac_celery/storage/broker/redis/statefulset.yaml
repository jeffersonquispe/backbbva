apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: aria-storage
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: redis
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata: {labels: {app.kubernetes.io/name: redis, app.kubernetes.io/component: broker, app.kubernetes.io/part-of: aria-storage}}
    spec:
      serviceAccountName: aria-redis
      containers:
        - name: redis
          image: docker.io/library/redis:7.2-alpine
          args: [redis-server, --appendonly, "$(REDIS_APPENDONLY)", --dir, /data]
          ports: [{name: redis, containerPort: 6379}]
          envFrom: [{configMapRef: {name: aria-redis-config}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
          startupProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: redis-data}}]
