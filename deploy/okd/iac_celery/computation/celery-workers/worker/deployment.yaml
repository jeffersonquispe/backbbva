apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: worker, app.kubernetes.io/component: celery-worker, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-worker
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: worker
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-worker:96d1a1902f30c9873f3d89c6274a6184f65a6978
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
          envFrom:
            - configMapRef: {name: aria-worker-config}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: AWS_SECRET_ACCESS_KEY}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: DYNAMO_SECRET_KEY}}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: OBJECT_STORAGE_ACCESS_KEY}}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: OBJECT_STORAGE_SECRET_KEY}}
            - name: OPENAI_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-runtime, key: OPENAI_KEY}}
