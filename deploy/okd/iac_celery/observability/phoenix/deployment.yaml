apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels: {app.kubernetes.io/name: phoenix, app.kubernetes.io/component: traces-ui, app.kubernetes.io/part-of: aria-observability, app.kubernetes.io/managed-by: argocd}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: phoenix}}
  template:
    metadata: {labels: {app.kubernetes.io/name: phoenix, app.kubernetes.io/component: traces-ui, app.kubernetes.io/part-of: aria-observability}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-phoenix
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: phoenix
          # Docker Hub image through BBVA Artifactory (hub.docker.com-remote, the
          # remote Jenkins already uses). Pin the version with platform before production.
          image: artifactory.globaldevtools.bbva.com:443/hub.docker.com-remote/arizephoenix/phoenix:version-19.21.0
          ports: [{name: http, containerPort: 6006}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 200m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
          env:
            - name: PHOENIX_DB_USER
              valueFrom: {secretKeyRef: {name: aria-phoenix-runtime, key: PHOENIX_DB_USER}}
            - name: PHOENIX_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-phoenix-runtime, key: PHOENIX_DB_PASSWORD}}
            - name: PHOENIX_DB_NAME
              valueFrom: {secretKeyRef: {name: aria-phoenix-runtime, key: PHOENIX_DB_NAME}}
            - name: PHOENIX_SQL_DATABASE_URL
              value: postgresql://$(PHOENIX_DB_USER):$(PHOENIX_DB_PASSWORD)@phoenix-db:5432/$(PHOENIX_DB_NAME)
            - {name: PHOENIX_HOST_ROOT_PATH, value: /phoenix}
            # OpenShift assigns an arbitrary UID with no writable home dir.
            # Phoenix otherwise defaults to /.phoenix; traces are persisted in
            # PostgreSQL, so keep its auxiliary working files under writable /tmp.
            - {name: PHOENIX_WORKING_DIR, value: /tmp/phoenix}
            # No outbound usage telemetry from the trace backend.
            - {name: PHOENIX_TELEMETRY_ENABLED, value: "false"}
            - name: PHOENIX_DEFAULT_RETENTION_POLICY_DAYS
              valueFrom: {configMapKeyRef: {name: aria-phoenix-config, key: PHOENIX_RETENTION_DAYS}}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 6}
