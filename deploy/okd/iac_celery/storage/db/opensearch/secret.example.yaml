# Template only: NOT listed in kustomization.yaml, so Argo CD never syncs (or
# overwrites) real values. Create it in the namespace out-of-band, e.g.
#   oc create secret generic aria-opensearch-runtime --from-literal=OPENSEARCH_INITIAL_ADMIN_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: aria-opensearch-runtime
  labels: {app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: aria}
type: Opaque
stringData:
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: REPLACE_ME
