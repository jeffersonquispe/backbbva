apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dynamodb
  labels: {app.kubernetes.io/name: dynamodb, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  serviceName: dynamodb
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: dynamodb}}
  template:
    metadata: {labels: {app.kubernetes.io/name: dynamodb, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-dynamodb
      containers:
        - name: dynamodb
          image: REGISTRY_REPLACE_ME/amazon/dynamodb-local:IMAGE_TAG_REPLACE_ME
          args: [-jar, DynamoDBLocal.jar, -sharedDb, -dbPath, /home/dynamodblocal/data]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: aria-dynamodb-config}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /home/dynamodblocal/data}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: dynamodb-data}}]
