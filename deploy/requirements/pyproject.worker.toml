# Poetry pyproject.toml for Celery worker

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aria-worker"
version = "0.1.0"
description = "Async worker for the novel massive fraud agent for BBVA company"
readme = "README.md"
authors = [
  "BBVA: <carlosdavid.rojas@bbva.com>"
]
license = ""
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12"
setuptools = "78.1.1"

celery = "5.6.2"
redis = "7.2.1"
openpyxl = "3.1.5"
boto3 = "1.40.38"
botocore = "1.40.38"
pydantic = "2.11.9"
pydantic-settings = "2.11.0"

# Model training (infrastructure/workflows/celery/model_training.py) - see
# backend CLAUDE.md's "Alert / workflow domain state" section for what these
# feed. No shap here: the worker only trains and persists the bundle: SHAP
# explanations are computed lazily at serving time by the separate FastMCP
# project (deploy/requirements/pyproject.mcp.toml).
xgboost = "2.1.3"
scikit-learn = "1.5.2"
pandas = "2.2.3"
numpy = "1.26.4"
joblib = "1.4.2"

langchain-openai = "0.3.3"
# 0.2.x line targets langchain-core ^0.3, matching langchain-openai above -
# do not jump to langchain-aws >=1.0 without also moving langchain-openai
# off 0.3.3, they pin incompatible langchain-core majors.
langchain-aws = ">=0.2.0,<0.3.0"

opentelemetry-api = "1.29.0"
opentelemetry-sdk = "1.29.0"
opentelemetry-exporter-otlp-proto-grpc = "1.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.6"
pytest-cov = "4.1.0"
pytest-env = "1.0.1"
black = "24.4.2"
isort = "5.13.2"
flake8 = "7.0.0"
flake8-pyproject = "1.2.3"
pyproject-autoflake = "1.0.2"
ruff = "0.8.4"
