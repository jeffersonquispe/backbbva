apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-api-config
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aria-main-services
    app.kubernetes.io/managed-by: argocd
data:
  AUTH_OIDC_ENABLED: "true"
  AUTH_OIDC_DISCOVERY_URL: https://preidp.work.global.platform.bbva.com/oidc/.well-known/openid-configuration
  AUTH_OIDC_REDIRECT_URI: https://nginx-aria-genai-dev.apps.work.ocp.co.igrupobbva/api/v0/auth/oidc/callback
  AUTH_OIDC_LOG_ENABLED: "true"
  AUTH_OIDC_INITIAL_ROLE: fraud_analyst
  AUTH_OIDC_COOKIE_SECURE: "true"
  # Container clock and business buckets (analyst matrix, metric rollups)
  # both follow Bogotá - see docs/OBSERVABILITY_STRATEGY.md.
  TZ: America/Bogota
  OPERATIONS_TIMEZONE: America/Bogota
  GENAI_ENVIRONMENT: development
  API_V0_STR: /api/v0
  COMPONENT_NAME: aria-api
  COMPONENT_VERSION: latest
  GENAI_PRODUCT: aria
  GENAI_APPLICATION: aria
  DEFAULT_LOGGING_LEVEL: INFO
  DYNAMO_ENDPOINT: http://dynamodb:8000
  DYNAMO_REGION_NAME: us-east-1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_DEFAULT_QUEUE: default
  CELERY_TEST_QUEUE: test
  CELERY_SIMULATOR_ALERT_QUEUE: simulator_alerts
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: aria-reports
  OBJECT_STORAGE_SSE_KMS_KEY_ID: ""
  DATASET_STORAGE_BACKEND: minio
  DATASET_STORAGE_BUCKET: datasets
  OPENSEARCH_ENDPOINT: https://opensearch:9200
  OPENSEARCH_AUTH_MODE: basic
  OPENSEARCH_INDEX: fraud_knowledge
  # Egress to Azure OpenAI goes through the corporate proxy (same as other services in the cluster);
  # internal services must bypass it via NO_PROXY.
  HTTP_PROXY: http://172.17.81.140:9480
  HTTPS_PROXY: http://172.17.81.140:9480
  http_proxy: http://172.17.81.140:9480
  https_proxy: http://172.17.81.140:9480
  NO_PROXY: localhost,127.0.0.1,.svc,.cluster.local,dynamodb,redis,minio,opensearch,otel-collector,mcp,event-api,api,nginx
  no_proxy: localhost,127.0.0.1,.svc,.cluster.local,dynamodb,redis,minio,opensearch,otel-collector,mcp,event-api,api,nginx
  LLM_BACKEND: azure
  OPENAI_ENDPOINT: https://genai-lupitaasistente-work-llm-openai.openai.azure.com/
  OPENAI_VERSION: "2024-08-01-preview"
  # Chat and drafts of the assistant run inside the API (REPORT or EXECUTOR model).
  EXECUTOR_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  REPORT_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  # Catalog of Azure deployments an element may select in Configuración/Pruebas:
  # JSON list, e.g. '[{"nombre":"GPT-5.2","deployment":"<azure-deployment>"}]'.
  # Empty = no catalog; every element keeps its *_LLM_MODEL above. Invalid JSON
  # stops the process at start-up. Keep the same value in API and workers.
  LLM_CATALOG: '[{"nombre":"GPT-5.2","deployment":"asistentelupita-llm-work-agent-gpt52"},{"nombre":"GPT-5 mini","deployment":"asistentelupita-llm-work-agent-gpt5mini"},{"nombre":"GPT-5 nano","deployment":"asistentelupita-llm-work-agent-gpt5nano"}]'
  EMBEDDING_MODEL: agentepqrs-llm-live-emebed-3-large
  EMBEDDING_DIMENSIONS: "3072"
  # Namespace Collector (observability/otel-collector), the only OTLP boundary.
  OTEL_ENDPOINT: http://otel-collector:4317
  OTEL_CAPTURE_LLM_CONTENT: "false"
