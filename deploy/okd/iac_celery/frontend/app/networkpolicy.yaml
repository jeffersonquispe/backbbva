apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: frontend}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}}]
      ports: [{protocol: TCP, port: 8080}]
