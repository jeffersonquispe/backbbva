apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: aria-build-staged-image-v2
  namespace: aria-genai-dev
spec:
  params:
    - {name: service, type: string}
    - {name: should-build, type: string, default: 'true'}
    - {name: image-repository, type: string}
    - {name: image-tag, type: string, default: ''}
    - {name: source-commit, type: string}
    - {name: source-dir, type: string}
    - {name: dockerfile, type: string}
    - {name: context-dir, type: string}
    - {name: source-branch, type: string}
  workspaces:
    - name: staging
    - name: registry-auth
  steps:
    - name: build-and-save-without-push
      image: quay.io/buildah/stable:v1.39.3
      computeResources:
        requests: {cpu: '1', memory: 2Gi}
        limits: {cpu: '2', memory: 4Gi}
      env:
        - {name: SERVICE, value: $(params.service)}
        - {name: SHOULD_BUILD, value: $(params.should-build)}
        - {name: IMAGE_REPOSITORY, value: $(params.image-repository)}
        - {name: IMAGE_TAG, value: $(params.image-tag)}
        - {name: SOURCE_COMMIT, value: $(params.source-commit)}
        - {name: SOURCE_DIR, value: $(params.source-dir)}
        - {name: DOCKERFILE, value: $(params.dockerfile)}
        - {name: CONTEXT_DIR, value: $(params.context-dir)}
        - {name: SOURCE_BRANCH, value: $(params.source-branch)}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if [[ "$SHOULD_BUILD" != true ]]; then
          echo "No source changes require a build for $SERVICE"; exit 0
        fi
        root='$(workspaces.staging.path)'
        service="$SERVICE"; commit="$SOURCE_COMMIT"; tag="${IMAGE_TAG:-$SOURCE_COMMIT}"
        [[ "$service" =~ ^[a-z0-9][a-z0-9-]*$ && "$commit" =~ ^[0-9a-f]{40,64}$ ]] || { echo 'invalid service or commit'; exit 2; }
        [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'invalid image tag'; exit 2; }
        [[ "$IMAGE_REPOSITORY" =~ ^artifactory\.globaldevtools\.bbva\.com:443/co-genai-public-cloud-docker-local/aria-genai/[A-Za-z0-9._/-]+$ ]] || { echo 'invalid image repository'; exit 2; }
        target="${IMAGE_REPOSITORY}:${tag}"
        context="$root/$SOURCE_DIR/$CONTEXT_DIR"
        dockerfile="$root/$SOURCE_DIR/$DOCKERFILE"
        [[ -d "$context" && -f "$dockerfile" ]] || { echo 'cloned context or Dockerfile is missing'; exit 2; }
        auth='$(workspaces.registry-auth.path)/.dockerconfigjson'
        [[ -r "$auth" ]] || { echo 'registry auth config is missing'; exit 2; }
        user=$(grep -m1 -o '"username"[[:space:]]*:[[:space:]]*"[^"]*"' "$auth" | sed -E 's/.*"([^"]*)"$/\1/' || true)
        password=$(grep -m1 -o '"password"[[:space:]]*:[[:space:]]*"[^"]*"' "$auth" | sed -E 's/.*"([^"]*)"$/\1/' || true)
        if [[ -z "$user" || -z "$password" ]]; then
          encoded=$(grep -m1 -o '"auth"[[:space:]]*:[[:space:]]*"[^"]*"' "$auth" | sed -E 's/.*"([^"]*)"$/\1/' || true)
          decoded=$(printf '%s' "$encoded" | base64 -d 2>/dev/null || true)
          user="${decoded%%:*}"; password="${decoded#*:}"
        fi
        [[ -n "$user" && -n "$password" ]] || { echo 'artifactory-auth must contain docker credentials'; exit 2; }
        umask 077
        secret_dir=$(mktemp -d /tmp/aria-build-auth.XXXXXX)
        trap 'rm -rf "$secret_dir"' EXIT
        printf '%s' "$user" > "$secret_dir/user"; printf '%s' "$password" > "$secret_dir/password"
        export HOME="$(mktemp -d /tmp/aria-build-home.XXXXXX)"
        export BUILDAH_ISOLATION=chroot
        export CONTAINERS_STORAGE_CONF="$HOME/storage.conf"
        mkdir -p "$HOME/storage" "$HOME/runroot"
        printf '[storage]\ndriver = "vfs"\nrunroot = "%s/runroot"\ngraphroot = "%s/storage"\n' \
          "$HOME" "$HOME" > "$CONTAINERS_STORAGE_CONF"
        artifact_dir="$root/images"; mkdir -p "$artifact_dir"
        artifact="$artifact_dir/${service}-${commit}.oci"
        marker="$artifact.meta"
        if [[ -s "$artifact" && -s "$artifact.sha256" && -s "$marker" ]]; then
          (cd "$artifact_dir" && sha256sum -c "${service}-${commit}.oci.sha256")
          IFS=$'\t' read -r old_service old_commit old_target old_status old_digest old_dir old_branch < "$marker"
          [[ "$old_service" = "$service" && "$old_commit" = "$commit" && "$old_target" = "$target" ]] || { echo 'immutable staged tag metadata conflicts'; exit 3; }
          echo 'verified staged artifact already exists; build skipped'; exit 0
        fi
        tempdir=$(mktemp -d "$artifact_dir/.${service}-${commit}.XXXXXX")
        image="localhost/aria-stage-${service}:${commit}"
        buildah bud --tls-verify=true --authfile "$auth" --secret "id=artifactory_user,src=$secret_dir/user" \
          --secret "id=artifactory_password,src=$secret_dir/password" --build-arg GENAI_ENVIRONMENT=dev \
          --format oci -f "$dockerfile" -t "$image" "$context"
        buildah push --tls-verify=true --authfile "$auth" --format oci "$image" "oci-archive:$tempdir/image.oci"
        checksum=$(sha256sum "$tempdir/image.oci" | awk '{print $1}')
        mv "$tempdir/image.oci" "$artifact"; rmdir "$tempdir"
        printf '%s  %s\n' "$checksum" "${service}-${commit}.oci" > "$artifact.sha256.tmp"
        mv "$artifact.sha256.tmp" "$artifact.sha256"
        printf '%s\t%s\t%s\tpending\t-\t%s\t%s\n' "$service" "$commit" "$target" "$SOURCE_DIR" "$SOURCE_BRANCH" > "$marker.tmp"
        mv "$marker.tmp" "$marker"
