apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-ingress
  labels: {app.kubernetes.io/name: opensearch, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: opensearch}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [api]}]}
      ports: [{protocol: TCP, port: 9200}]
