services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: aria-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    user: root
    ports:
      - "${LOCAL_DYNAMODB_PORT:-8002}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - aria-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: aria-redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: aria-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
    ports:
      - "${LOCAL_MINIO_PORT:-9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: aria-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${LOCAL_OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - aria-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.api
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-api:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-api
    ports:
      - "${LOCAL_API_PORT:-8000}:8000"
    volumes:
      - ../../../datasets:/app/datasets:ro
      # LLM backend/credentials live here, not in environment: below - see
      # config/local/config.cfg, read directly by Config._env_file.
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      DATASETS_DIR: /app/datasets
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-api}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      COMPONENT_DESCRIPTION: ${COMPONENT_DESCRIPTION:-Transactional API}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_NAME: ${GENAI_NAME:-aria-api}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      ASYNC_EXECUTOR_BACKEND: ${ASYNC_EXECUTOR_BACKEND:-celery}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aria-reports}
      OPENSEARCH_ENDPOINT: http://opensearch:9200
      OPENSEARCH_AUTH_MODE: ${OPENSEARCH_AUTH_MODE:-basic}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-dummy}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-fraud_knowledge}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - aria-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.worker
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-worker:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker
    volumes:
      # LLM backend/credentials live here, not in environment: below - see
      # config/local/config.cfg, read directly by Config._env_file.
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-worker}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      COMPONENT_DESCRIPTION: ${COMPONENT_DESCRIPTION:-Async worker}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_NAME: ${GENAI_NAME:-aria-worker}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aria-reports}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - aria-net

networks:
  aria-net:
    name: aria-net
    driver: bridge

volumes:
  dynamodb-data:
  minio-data:
  opensearch-data:
