apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: dashboards, app.kubernetes.io/part-of: aria-observability}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-grafana
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.4.0
          ports: [{name: http, containerPort: 3000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          env:
            # Unlike the local stack there is no anonymous access: it is
            # reachable from outside the namespace through nginx.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            # Served through nginx at /grafana/ (no Route of its own).
            - {name: GF_SERVER_ROOT_URL, value: /grafana/}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_FEATURE_TOGGLES_ENABLE, value: traceqlEditor}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: aria-grafana-runtime, key: GF_SECURITY_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-grafana-runtime, key: GF_SECURITY_ADMIN_PASSWORD}}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
          startupProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 20, failureThreshold: 6}
      volumes:
        - {name: datasources, configMap: {name: aria-grafana-datasources}}
        - {name: dashboard-provider, configMap: {name: aria-grafana-dashboard-provider}}
        - {name: alerting, configMap: {name: aria-grafana-alerting}}
        - {name: dashboards, configMap: {name: aria-grafana-dashboards}}
        # Everything is provisioned from ConfigMaps, so state is disposable.
        - {name: data, emptyDir: {}}
