apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-worker-simulator
  labels:
    app.kubernetes.io/name: aria-worker-simulator
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: aria-workers
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: aria-worker-simulator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aria-worker-simulator, app.kubernetes.io/component: celery-worker, app.kubernetes.io/part-of: aria-workers}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-worker-simulator
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: aria-worker-simulator
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-event-simulator-worker:14a263531ebcb2d03a531cfcafde3254af3a1589
          command: [celery, -A, src.infrastructure.entrypoint.simulator.celery.celery_app:app, worker, --loglevel=INFO, --concurrency=1, -Q, event_simulation]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
          envFrom:
            - configMapRef: {name: aria-worker-simulator-config}
          env:
            - name: EVENT_SIMULATOR_ARIA_API_TOKEN
              valueFrom: {secretKeyRef: {name: aria-worker-simulator-runtime, key: EVENT_SIMULATOR_ARIA_API_TOKEN}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-simulator-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-simulator-runtime, key: DYNAMO_SECRET_KEY}}
            - name: OPENAI_KEY
              valueFrom: {secretKeyRef: {name: aria-worker-simulator-runtime, key: OPENAI_KEY}}
