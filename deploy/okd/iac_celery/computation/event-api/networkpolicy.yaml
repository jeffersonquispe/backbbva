apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event-api-ingress
  labels: {app.kubernetes.io/name: event-api, app.kubernetes.io/part-of: aria-main-services, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: event-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-ingress}}
      ports: [{protocol: TCP, port: 8080}]
