apiVersion: apps/v1
kind: Deployment
metadata:
  name: aria-worker-scheduler
  labels:
    app.kubernetes.io/name: aria-worker-scheduler
    app.kubernetes.io/component: celery-scheduler
    app.kubernetes.io/part-of: aria-workers
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  # One beat publishes each retention sweep, including Vector Store cleanup.
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: aria-worker-scheduler}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aria-worker-scheduler, app.kubernetes.io/component: celery-scheduler, app.kubernetes.io/part-of: aria-workers}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-worker-scheduler
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: aria-worker-scheduler
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-worker:14a263531ebcb2d03a531cfcafde3254af3a1589
          command: [celery, -A, src.infrastructure.entrypoint.worker.celery.celery_app:app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom:
            - configMapRef: {name: aria-worker-scheduler-config}
