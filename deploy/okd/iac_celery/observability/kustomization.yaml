# Observability group: telemetry pipeline + in-namespace backends.
#   otel-collector -> tempo (traces) | loki (logs) | prometheus (metrics)
#   tempo/loki persist to observability-minio (buckets via observability-minio-init)
#   grafana reads all three.
#   otel-collector -> phoenix (trace UI, PostgreSQL-backed) over OTLP HTTP.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - observability-minio
  - observability-minio-init
  - tempo
  - loki
  - prometheus
  - phoenix
  - otel-collector
  - grafana
