apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aria-minio-secrets
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  provider: openbao
  secretObjects:
    - secretName: aria-minio-runtime
      type: Opaque
      data:
        - objectName: MINIO_ROOT_USER
          key: MINIO_ROOT_USER
        - objectName: MINIO_ROOT_PASSWORD
          key: MINIO_ROOT_PASSWORD
  parameters:
    roleName: aria-minio
    baoAddress: OPENBAO_URL_REPLACE_ME
    objects: |
      - objectName: MINIO_ROOT_USER
        secretPath: secret/data/aria/infrastructure/minio
        secretKey: MINIO_ROOT_USER
      - objectName: MINIO_ROOT_PASSWORD
        secretPath: secret/data/aria/infrastructure/minio
        secretKey: MINIO_ROOT_PASSWORD
