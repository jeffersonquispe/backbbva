apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/part-of: aria-observability, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: tempo}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [otel-collector]}]}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [grafana, prometheus]}]}
      ports: [{protocol: TCP, port: 3200}]
