apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aria-api-secrets
  labels: {app.kubernetes.io/name: api, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  provider: openbao
  secretObjects:
    - secretName: aria-api-runtime
      type: Opaque
      data:
        - objectName: AUTH_JWT_SECRET
          key: AUTH_JWT_SECRET
        - objectName: AUTH_BOOTSTRAP_TOKEN
          key: AUTH_BOOTSTRAP_TOKEN
        - objectName: AWS_ACCESS_KEY_ID
          key: AWS_ACCESS_KEY_ID
        - objectName: AWS_SECRET_ACCESS_KEY
          key: AWS_SECRET_ACCESS_KEY
        - objectName: DYNAMO_ACCESS_KEY
          key: DYNAMO_ACCESS_KEY
        - objectName: DYNAMO_SECRET_KEY
          key: DYNAMO_SECRET_KEY
        - objectName: OBJECT_STORAGE_ACCESS_KEY
          key: OBJECT_STORAGE_ACCESS_KEY
        - objectName: OBJECT_STORAGE_SECRET_KEY
          key: OBJECT_STORAGE_SECRET_KEY
        - objectName: OPENSEARCH_USERNAME
          key: OPENSEARCH_USERNAME
        - objectName: OPENSEARCH_PASSWORD
          key: OPENSEARCH_PASSWORD
  parameters:
    roleName: aria-api
    baoAddress: OPENBAO_URL_REPLACE_ME
    objects: |
      - objectName: AUTH_JWT_SECRET
        secretPath: secret/data/aria/api/auth
        secretKey: AUTH_JWT_SECRET
      - objectName: AUTH_BOOTSTRAP_TOKEN
        secretPath: secret/data/aria/api/auth
        secretKey: AUTH_BOOTSTRAP_TOKEN
      - objectName: AWS_ACCESS_KEY_ID
        secretPath: secret/data/aria/api/storage
        secretKey: AWS_ACCESS_KEY_ID
      - objectName: AWS_SECRET_ACCESS_KEY
        secretPath: secret/data/aria/api/storage
        secretKey: AWS_SECRET_ACCESS_KEY
      - objectName: DYNAMO_ACCESS_KEY
        secretPath: secret/data/aria/api/storage
        secretKey: DYNAMO_ACCESS_KEY
      - objectName: DYNAMO_SECRET_KEY
        secretPath: secret/data/aria/api/storage
        secretKey: DYNAMO_SECRET_KEY
      - objectName: OBJECT_STORAGE_ACCESS_KEY
        secretPath: secret/data/aria/api/storage
        secretKey: OBJECT_STORAGE_ACCESS_KEY
      - objectName: OBJECT_STORAGE_SECRET_KEY
        secretPath: secret/data/aria/api/storage
        secretKey: OBJECT_STORAGE_SECRET_KEY
      - objectName: OPENSEARCH_USERNAME
        secretPath: secret/data/aria/api/opensearch
        secretKey: OPENSEARCH_USERNAME
      - objectName: OPENSEARCH_PASSWORD
        secretPath: secret/data/aria/api/opensearch
        secretKey: OPENSEARCH_PASSWORD
