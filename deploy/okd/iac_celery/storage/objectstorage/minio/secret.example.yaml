# Template only: NOT listed in kustomization.yaml, so Argo CD never syncs (or
# overwrites) real values. Create it in the namespace out-of-band, e.g.
#   oc create secret generic aria-minio-runtime --from-literal=MINIO_ROOT_USER=... --from-literal=MINIO_ROOT_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: aria-minio-runtime
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: aria}
type: Opaque
stringData:
  MINIO_ROOT_USER: REPLACE_ME
  MINIO_ROOT_PASSWORD: REPLACE_ME
