# Creates the tempo/loki buckets. Argo CD Sync hook: recreated on every sync
# (Jobs are immutable), runs after observability-minio (wave 0) and before
# tempo/loki (wave 2). Idempotent (--ignore-existing).
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-minio-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: observability-minio-init
    app.kubernetes.io/component: objectstorage-init
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
spec:
  backoffLimit: 6
  template:
    metadata: {labels: {app.kubernetes.io/name: observability-minio-init, app.kubernetes.io/component: objectstorage-init, app.kubernetes.io/part-of: aria-observability}}
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      serviceAccountName: aria-observability-minio
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio:latest
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          env:
            - {name: MC_CONFIG_DIR, value: /tmp/.mc}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-observability-minio-runtime, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-observability-minio-runtime, key: S3_SECRET_KEY}}
          command: [/bin/sh, -c]
          args:
            - |
              set -e
              mc alias set local http://observability-minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
              mc mb --ignore-existing local/tempo
              mc mb --ignore-existing local/loki
