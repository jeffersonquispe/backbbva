apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mcp}}
  template:
    metadata: {labels: {app.kubernetes.io/name: mcp, app.kubernetes.io/component: mcp, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-mcp
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: mcp
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-mcp:latest
          ports: [{name: http, containerPort: 8100}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom:
            - configMapRef: {name: aria-mcp-config}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: aria-mcp-runtime, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-mcp-runtime, key: AWS_SECRET_ACCESS_KEY}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-mcp-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-mcp-runtime, key: DYNAMO_SECRET_KEY}}
            - name: OBJECT_STORAGE_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-mcp-runtime, key: OBJECT_STORAGE_ACCESS_KEY}}
            - name: OBJECT_STORAGE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-mcp-runtime, key: OBJECT_STORAGE_SECRET_KEY}}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
