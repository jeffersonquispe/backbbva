apiVersion: batch/v1
kind: CronJob
metadata:
  name: aria-capacity-controller
  labels: {app.kubernetes.io/name: aria-capacity-controller, app.kubernetes.io/part-of: aria-workers, app.kubernetes.io/managed-by: argocd}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 45
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          serviceAccountName: aria-capacity-controller
          imagePullSecrets:
            - name: artifactory-auth
          containers:
            - name: reconcile
              image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-backend-aria-worker:14a263531ebcb2d03a531cfcafde3254af3a1589
              command: [python, -m, src.infrastructure.deployment.okd.capacity_reconciler]
              envFrom:
                - configMapRef: {name: aria-worker-main-config}
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: aria-worker-main-runtime, key: AWS_ACCESS_KEY_ID}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: aria-worker-main-runtime, key: AWS_SECRET_ACCESS_KEY}}
                - name: DYNAMO_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: aria-worker-main-runtime, key: DYNAMO_ACCESS_KEY}}
                - name: DYNAMO_SECRET_KEY
                  valueFrom: {secretKeyRef: {name: aria-worker-main-runtime, key: DYNAMO_SECRET_KEY}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
