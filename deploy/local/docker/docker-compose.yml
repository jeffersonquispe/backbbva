services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: aria-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    user: root
    ports:
      - "${LOCAL_DYNAMODB_PORT:-8002}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - aria-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/8000' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: aria-redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: aria-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
    ports:
      - "${LOCAL_MINIO_PORT:-9000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - aria-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: aria-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${LOCAL_OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    networks:
      - aria-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  api:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.api
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-api:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-api
    command: ["uvicorn", "src.infrastructure.entrypoint.api.fastapi_app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_SERVER_WORKERS:-1}"]
    ports:
      - "${LOCAL_API_PORT:-8000}:8000"
    volumes:
      - ../../../datasets:/app/datasets:ro
      # LLM backend/credentials live here, not in environment: below - see
      # config/local/config.cfg, read directly by Config._env_file.
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:-docker}
      DATASETS_DIR: /app/datasets
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-api}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      COMPONENT_DESCRIPTION: ${COMPONENT_DESCRIPTION:-Transactional API}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_NAME: ${GENAI_NAME:-aria-api}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Empty bootstrap token disables user provisioning. Export both values
      # before starting the local stack; they are never persisted by Make.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-in-production}
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      ASYNC_EXECUTOR_BACKEND: ${ASYNC_EXECUTOR_BACKEND:-celery}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      CELERY_AGENT_QUEUE: ${CELERY_AGENT_QUEUE:-agent}
      AGENT_STUB_DELAY_SECONDS: ${AGENT_STUB_DELAY_SECONDS:-0}
      CELERY_TEST_QUEUE: ${CELERY_TEST_QUEUE:-test}
      CELERY_SIMULATOR_ALERT_QUEUE: ${CELERY_SIMULATOR_ALERT_QUEUE:-simulator_alerts}
      CELERY_STUCK_TASK_TIMEOUT_SECONDS: ${CELERY_STUCK_TASK_TIMEOUT_SECONDS:-900}
      CELERY_STUCK_QUEUE_TIMEOUT_SECONDS: ${CELERY_STUCK_QUEUE_TIMEOUT_SECONDS:-3600}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aria-reports}
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-minio}
      DATASET_STORAGE_BUCKET: ${DATASET_STORAGE_BUCKET:-datasets}
      OPENSEARCH_ENDPOINT: http://opensearch:9200
      OPENSEARCH_AUTH_MODE: ${OPENSEARCH_AUTH_MODE:-basic}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-dummy}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-fraud_knowledge}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  event-api:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.eventapi
    image: aria-event-api:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-event-api
    ports:
      - "${LOCAL_EVENT_API_PORT:-8001}:8080"
    environment:
      EVENT_API_OIDC_ISSUER: ${EVENT_API_OIDC_ISSUER:-http://event-api-oidc:8080/realms/aria}
      EVENT_API_OIDC_AUDIENCE: ${EVENT_API_OIDC_AUDIENCE:-aria-event-api}
      EVENT_API_OIDC_JWKS_URL: ${EVENT_API_OIDC_JWKS_URL:-http://event-api-oidc:8080/realms/aria/protocol/openid-connect/certs}
      EVENT_API_OIDC_ALLOWED_CLIENT_ID: ${EVENT_API_OIDC_ALLOWED_CLIENT_ID:-frm}
      EVENT_API_MAX_BODY_BYTES: ${EVENT_API_MAX_BODY_BYTES:-262144}
      EVENT_API_REDIS_URL: redis://redis:6379/2
      EVENT_API_CELERY_BROKER_URL: redis://redis:6379/0
      EVENT_API_PRODUCTION_QUEUE: ${EVENT_API_PRODUCTION_QUEUE:-production_events}
      EVENT_API_IDEMPOTENCY_TTL_SECONDS: ${EVENT_API_IDEMPOTENCY_TTL_SECONDS:-2592000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  event-api-unavailable:
    profiles: [event-api-e2e]
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.eventapi
    image: aria-event-api:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-event-api-unavailable
    ports:
      - "${LOCAL_EVENT_API_UNAVAILABLE_PORT:-8003}:8080"
    environment:
      EVENT_API_OIDC_ISSUER: ${EVENT_API_OIDC_ISSUER:-http://event-api-oidc:8080/realms/aria}
      EVENT_API_OIDC_AUDIENCE: ${EVENT_API_OIDC_AUDIENCE:-aria-event-api}
      EVENT_API_OIDC_JWKS_URL: ${EVENT_API_OIDC_JWKS_URL:-http://event-api-oidc:8080/realms/aria/protocol/openid-connect/certs}
      EVENT_API_OIDC_ALLOWED_CLIENT_ID: ${EVENT_API_OIDC_ALLOWED_CLIENT_ID:-frm}
      EVENT_API_MAX_BODY_BYTES: ${EVENT_API_MAX_BODY_BYTES:-262144}
      EVENT_API_REDIS_URL: redis://redis:6379/2
      EVENT_API_CELERY_BROKER_URL: redis://redis:6399/0
      EVENT_API_PRODUCTION_QUEUE: ${EVENT_API_PRODUCTION_QUEUE:-production_events}
      EVENT_API_IDEMPOTENCY_TTL_SECONDS: ${EVENT_API_IDEMPOTENCY_TTL_SECONDS:-2592000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  event-api-oidc:
    profiles: [event-api-e2e]
    image: quay.io/keycloak/keycloak:26.2
    container_name: aria-event-api-oidc
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-only
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://event-api-oidc:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${LOCAL_EVENT_API_OIDC_PORT:-8085}:8080"
    volumes:
      - ./event-api-realm:/opt/keycloak/data/import:ro
    networks:
      - aria-net
    restart: unless-stopped

  aria-worker-main:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.worker
      # Keep the dependency layers cached. Dockerfile.worker copies the
      # requirements manifest before installing dependencies, so code-only
      # changes reuse Poetry and the virtualenv layers. Use
      # LOCAL_DOCKER_BUILD_ARGS=--no-cache for an intentional clean rebuild.
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-worker-main:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker-main
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.celery.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-10}", "-Q", "${CELERY_WORKER_QUEUES:-default,production_events}"]
    volumes:
      # LLM backend/credentials live here, not in environment: below - see
      # config/local/config.cfg, read directly by Config._env_file.
      - ../../../config:/code/config:ro
      - ../../../backups:/code/backups
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:-docker}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-worker-main}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      COMPONENT_DESCRIPTION: ${COMPONENT_DESCRIPTION:-Async worker}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_NAME: ${GENAI_NAME:-aria-worker-main}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      CELERY_WORKER_QUEUES: ${CELERY_WORKER_QUEUES:-default,production_events}
      CELERY_AGENT_QUEUE: ${CELERY_AGENT_QUEUE:-agent}
      CELERY_STUCK_TASK_TIMEOUT_SECONDS: ${CELERY_STUCK_TASK_TIMEOUT_SECONDS:-900}
      CELERY_STUCK_QUEUE_TIMEOUT_SECONDS: ${CELERY_STUCK_QUEUE_TIMEOUT_SECONDS:-3600}
      MCP_BASE_URL: http://mcp:8100
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-15}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aria-reports}
      OPENSEARCH_ENDPOINT: http://opensearch:9200
      OPENSEARCH_AUTH_MODE: ${OPENSEARCH_AUTH_MODE:-basic}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-dummy}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-fraud_knowledge}
      OPENSEARCH_VERIFY_CERTS: ${OPENSEARCH_VERIFY_CERTS:-false}
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-minio}
      DATASET_STORAGE_BUCKET: ${DATASET_STORAGE_BUCKET:-datasets}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:-models}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_CAPTURE_LLM_CONTENT: ${OTEL_CAPTURE_LLM_CONTENT:-false}
    restart: unless-stopped
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks:
      - aria-net

  aria-agent-worker:
    extends:
      service: aria-worker-main
    container_name: aria-agent-worker
    command: ["celery", "-A", "src.infrastructure.entrypoint.agent_worker.celery.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "${CELERY_AGENT_QUEUE:-agent}"]
    environment:
      COMPONENT_NAME: aria-agent-worker
      COMPONENT_DESCRIPTION: Isolated assistant and optimizer worker
      CELERY_AGENT_QUEUE: ${CELERY_AGENT_QUEUE:-agent}
      AGENT_STUB_DELAY_SECONDS: ${AGENT_STUB_DELAY_SECONDS:-0}
      E2E_PRESERVE_DATA: ${E2E_PRESERVE_DATA:-0}

  aria-agent-beat:
    extends:
      service: aria-worker-main
    container_name: aria-agent-beat
    command: ["celery", "-A", "src.infrastructure.entrypoint.agent_worker.celery.celery_app:app", "beat", "--loglevel=INFO", "--schedule=/tmp/agent-celerybeat-schedule"]
    environment:
      COMPONENT_NAME: aria-agent-beat
      COMPONENT_DESCRIPTION: Scheduler for assistant and optimizer recovery
      CELERY_AGENT_QUEUE: ${CELERY_AGENT_QUEUE:-agent}

  aria-worker-training:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.training.worker
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-training-worker:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker-training
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.celery.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "model-training"]
    volumes:
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:-docker}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_CAPTURE_LLM_CONTENT: ${OTEL_CAPTURE_LLM_CONTENT:-false}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:-models}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped

  # Dedicated capacity for CSV/batch test runs. Production traffic is only
  # consumed by `worker` on CELERY_DEFAULT_QUEUE.
  aria-worker-test:
    image: aria-worker-main:${LOCAL_IMAGE_TAG:-local}
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.celery.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_TEST_WORKER_CONCURRENCY:-1}", "-Q", "${CELERY_TEST_QUEUE:-test}"]
    volumes:
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:-docker}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      CELERY_TEST_QUEUE: ${CELERY_TEST_QUEUE:-test}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_CAPTURE_LLM_CONTENT: ${OTEL_CAPTURE_LLM_CONTENT:-false}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aria-reports}
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-minio}
      DATASET_STORAGE_BUCKET: ${DATASET_STORAGE_BUCKET:-datasets}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:-models}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped

  # Simulator alerts run through the active production pipeline/configuration
  # while keeping their workload off the production worker pool.
  aria-worker-simulator-alerts:
    image: aria-worker-main:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker-simulator-alerts
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.celery.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_SIMULATOR_ALERT_WORKER_CONCURRENCY:-1}", "-Q", "${CELERY_SIMULATOR_ALERT_QUEUE:-simulator_alerts}"]
    volumes:
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      CELERY_TEST_QUEUE: ${CELERY_TEST_QUEUE:-test}
      CELERY_SIMULATOR_ALERT_QUEUE: ${CELERY_SIMULATOR_ALERT_QUEUE:-simulator_alerts}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_CAPTURE_LLM_CONTENT: ${OTEL_CAPTURE_LLM_CONTENT:-false}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aria-reports}
      DATASET_STORAGE_BACKEND: ${DATASET_STORAGE_BACKEND:-minio}
      DATASET_STORAGE_BUCKET: ${DATASET_STORAGE_BUCKET:-datasets}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:-models}
      OPENSEARCH_ENDPOINT: http://opensearch:9200
      OPENSEARCH_AUTH_MODE: ${OPENSEARCH_AUTH_MODE:-basic}
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME:-admin}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-dummy}
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-fraud_knowledge}
      MCP_BASE_URL: http://mcp:8100
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-15}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      api:
        condition: service_healthy
      mcp:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped

  # Exactly one scheduler process must run per environment.  It only
  # publishes periodic maintenance tasks; workers execute them normally.
  aria-worker-scheduler:
    image: aria-worker-main:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker-scheduler
    command: ["celery", "-A", "src.infrastructure.entrypoint.worker.celery.celery_app:app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    volumes:
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      API_V0_STR: ${API_V0_STR:-/api/v0}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_DEFAULT_QUEUE: ${CELERY_DEFAULT_QUEUE:-default}
      CELERY_RECONCILE_INTERVAL_SECONDS: ${CELERY_RECONCILE_INTERVAL_SECONDS:-60}
      CELERY_RECONCILE_LIMIT: ${CELERY_RECONCILE_LIMIT:-100}
      CELERY_TEST_RUN_CLEANUP_INTERVAL_SECONDS: ${CELERY_TEST_RUN_CLEANUP_INTERVAL_SECONDS:-3600}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_CAPTURE_LLM_CONTENT: ${OTEL_CAPTURE_LLM_CONTENT:-false}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped

  aria-worker-simulator:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.simulator.worker
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-event-simulator-worker:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-worker-simulator
    command: ["celery", "-A", "src.infrastructure.entrypoint.simulator.celery.celery_app:app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_SIMULATOR_WORKER_CONCURRENCY:-1}", "-Q", "${EVENT_SIMULATOR_CELERY_QUEUE:-event_simulation}"]
    volumes:
      # LLM backend/credentials live here, not in environment: below - see
      # config/local/config.cfg, read directly by Config._env_file.
      - ../../../config:/code/config:ro
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      # Required by the shared Config class (infrastructure/core/config.py)
      # even though this worker has no FastAPI router of its own - same
      # pre-existing gap as mcp's block below.
      API_V0_STR: ${API_V0_STR:-/api/v0}
      COMPONENT_NAME: ${COMPONENT_NAME:-aria-event-simulator-worker}
      COMPONENT_VERSION: ${COMPONENT_VERSION:-0.1.0}
      GENAI_PRODUCT: ${GENAI_PRODUCT:-aria}
      GENAI_APPLICATION: ${GENAI_APPLICATION:-aria}
      DEFAULT_LOGGING_LEVEL: ${DEFAULT_LOGGING_LEVEL:-INFO}
      EVENT_SIMULATOR_TICK_SECONDS: ${EVENT_SIMULATOR_TICK_SECONDS:-10}
      EVENT_SIMULATOR_MAX_EVENTS_PER_TICK: ${EVENT_SIMULATOR_MAX_EVENTS_PER_TICK:-200}
      EVENT_SIMULATOR_CELERY_BROKER_URL: redis://redis:6379/2
      EVENT_SIMULATOR_CELERY_RESULT_BACKEND: redis://redis:6379/3
      EVENT_SIMULATOR_CELERY_QUEUE: ${EVENT_SIMULATOR_CELERY_QUEUE:-event_simulation}
      EVENT_SIMULATOR_ARIA_API_BASE_URL: http://api:8000
      EVENT_SIMULATOR_ARIA_API_TOKEN: ${EVENT_SIMULATOR_ARIA_API_TOKEN:-}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      OTEL_CAPTURE_LLM_CONTENT: ${OTEL_CAPTURE_LLM_CONTENT:-false}
    depends_on:
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # aria-api owns scenario CRUD/lifecycle (scenarios_router.py) and
      # creates the shared event_simulation_scenarios table on its own
      # startup - this worker only ever reads/updates rows in it.
      api:
        condition: service_healthy
    networks:
      - aria-net
    restart: unless-stopped

  mcp:
    build:
      context: ../../..
      dockerfile: deploy/local/docker/Dockerfile.mcp
      args:
        GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
    image: aria-mcp:${LOCAL_IMAGE_TAG:-local}
    container_name: aria-mcp
    ports:
      - "${LOCAL_MCP_PORT:-8100}:8100"
    environment:
      GENAI_ENVIRONMENT: ${GENAI_ENVIRONMENT:-local}
      # Required by the shared Config class (infrastructure/core/config.py)
      # even though this service has no FastAPI router - not otherwise used.
      API_V0_STR: ${API_V0_STR:-/api/v0}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION_NAME: ${DYNAMO_REGION_NAME:-us-east-1}
      DYNAMO_ACCESS_KEY: ${DYNAMO_ACCESS_KEY:-dummy}
      DYNAMO_SECRET_KEY: ${DYNAMO_SECRET_KEY:-dummy}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-dummy}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-dummy123}
      MODEL_STORAGE_BUCKET: ${MODEL_STORAGE_BUCKET:-models}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8100), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      dynamodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - aria-net

  # Local observability services are part of the same stack so workers can
  # always reach the collector when the main Compose project starts.
  observability-minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: aria-observability-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-observability}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-observability}
    ports:
      - "${LOCAL_OBSERVABILITY_MINIO_API_PORT:-9010}:9000"
      - "${LOCAL_OBSERVABILITY_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - observability-minio-data:/data
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  observability-minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: aria-observability-minio-init
    depends_on:
      observability-minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-observability}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-observability}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://observability-minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/tempo &&
      mc mb --ignore-existing local/loki
      "
    networks:
      - aria-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: aria-otel-collector
    command: ["--config=/etc/otel-collector/collector.yaml"]
    volumes:
      - ./observability/otel-collector/collector.yaml:/etc/otel-collector/collector.yaml:ro
    ports:
      - "${LOCAL_OTEL_GRPC_PORT:-4317}:4317"
      - "${LOCAL_OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      - tempo
      - loki
      - prometheus
    networks:
      - aria-net
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otel-collector/collector.yaml"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  tempo:
    image: grafana/tempo:2.6.1
    container_name: aria-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-observability}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-observability}
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    depends_on:
      observability-minio-init:
        condition: service_completed_successfully
    networks:
      - aria-net

  loki:
    image: grafana/loki:3.3.2
    container_name: aria-loki
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-observability}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-observability}
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    depends_on:
      observability-minio-init:
        condition: service_completed_successfully
    networks:
      - aria-net

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: aria-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${LOCAL_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - aria-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: aria-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${LOCAL_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - aria-net

networks:
  aria-net:
    name: aria-net
    driver: bridge
volumes:
  dynamodb-data:
  minio-data:
  opensearch-data:
  observability-minio-data:
