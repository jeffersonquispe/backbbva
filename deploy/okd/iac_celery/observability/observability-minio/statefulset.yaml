apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: observability-minio
  annotations: {argocd.argoproj.io/sync-wave: "0"}
  labels:
    app.kubernetes.io/name: observability-minio
    app.kubernetes.io/component: objectstorage
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: observability-minio
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: observability-minio}}
  template:
    metadata: {labels: {app.kubernetes.io/name: observability-minio, app.kubernetes.io/component: objectstorage, app.kubernetes.io/part-of: aria-observability}}
    spec:
      enableServiceLinks: false
      serviceAccountName: aria-observability-minio
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: [server, /data]
          ports: [{name: http, containerPort: 9000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 4Gi}, limits: {cpu: 500m, memory: 4Gi}}
          env:
            - {name: MINIO_BROWSER, value: "off"}
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: aria-observability-minio-runtime, key: S3_ACCESS_KEY}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-observability-minio-runtime, key: S3_SECRET_KEY}}
          volumeMounts: [{name: data, mountPath: /data}]
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: observability-minio-data}}
