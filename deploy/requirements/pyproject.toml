# Poetry pyproject.toml: https://python-poetry.org/docs/pyproject/

[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aria-api"
version = "0.1.0"
description = "API for the novel massive fraud agent for BBVA company"
readme = "README.md"
authors = [
  "BBVA: <carlosdavid.rojas@bbva.com>"]
license = ""
packages = [
    { include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.12"
setuptools = "78.1.1"

fastapi = "0.117.1"
python-multipart = "0.0.20"
uvicorn = "0.37.0"
pydantic = "2.11.9"
pydantic-settings = "2.11.0"
boto3 = "1.40.38"
botocore = "1.40.38"
celery = "5.6.2"
redis = "7.2.1"

langchain-openai = "0.3.3"
# 0.2.x line targets langchain-core ^0.3, matching langchain-openai above -
# do not jump to langchain-aws >=1.0 without also moving langchain-openai
# off 0.3.3, they pin incompatible langchain-core majors.
langchain-aws = ">=0.2.0,<0.3.0"

opensearch-py = "2.8.0"

opentelemetry-api = "1.29.0"
opentelemetry-sdk = "1.29.0"
opentelemetry-exporter-otlp-proto-grpc = "1.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.2.0"
pytest-asyncio = "0.23.6"
pytest-cov = "4.1.0"
pytest-env = "1.0.1"
black = "24.4.2"
isort = "5.13.2"
flake8 = "7.0.0"
flake8-pyproject = "1.2.3"
pyproject-autoflake = "1.0.2"
ruff = "0.8.4"
mypy = "1.13.0"
vulture = "2.16.0"

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
use_parentheses = true

[tool.coverage.run]
branch = true
source = ["src"]
command_line = "-m pytest"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -v --durations=0 --cov=src --cov-report=term --cov-report=xml --junitxml=xunit-result.xml"
cache_dir = ".cache/pytest_cache"
python_files = ["**/*.py"]
env = ["GENAI_ENVIRONMENT=test"]
markers = ["docker_integration: requires Docker services, especially DynamoDB Local"]

[tool.flake8]
max-line-length = 88
exclude = [".git",".venv","__pycache__", "old", "build", "dist",
    "./src/infrastructure/core/config.py",
    "./config/**/*.py"]
ignore = ["DAR101", "DAR103", "DAR402", "DAR401", "DAR201",
    "DAR102", "DAR003", "DAR301", "E999", "W293", "W391","E203","E402", "E303"]

[tool.autoflake]
in-place = true
recursive = true
remove-all-unused-imports = true
exclude = ["./config/**/*.py", "./src/infraestructure/core/*.*"]

# Vulture complements Ruff: it identifies unreachable code and imports that
# cannot be reached statically.  Keep the default at >=80% to make this target
# actionable; use `make dead-code DEAD_CODE_MIN_CONFIDENCE=60` for the broader
# (and noisier) review report.
[tool.vulture]
paths = ["src"]
exclude = ["*/__pycache__/*", "*/.venv/*"]
min_confidence = 80
sort_by_size = true
