apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: frontend}}
  template:
    metadata: {labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/component: frontend, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-frontend
      imagePullSecrets:
        - name: artifactory-auth
      containers:
        - name: frontend
          image: artifactory.globaldevtools.bbva.com:443/co-genai-public-cloud-docker-local/aria-genai/co-frontend-app-aria-frontend:83667d908d8d36d2c9767574cb959ce3aaae71ad
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: aria-frontend-config}}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
