apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-worker
  labels:
    app.kubernetes.io/name: simulator-worker
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: simulator-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: simulator-worker, app.kubernetes.io/component: celery-worker, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-simulator-worker
      containers:
        - name: simulator-worker
          image: REGISTRY_REPLACE_ME/aria-event-simulator-worker:IMAGE_TAG_REPLACE_ME
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom:
            - configMapRef: {name: aria-simulator-worker-config}
          env:
            - name: EVENT_SIMULATOR_ARIA_API_TOKEN
              valueFrom: {secretKeyRef: {name: aria-simulator-worker-runtime, key: EVENT_SIMULATOR_ARIA_API_TOKEN}}
            - name: DYNAMO_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: aria-simulator-worker-runtime, key: DYNAMO_ACCESS_KEY}}
            - name: DYNAMO_SECRET_KEY
              valueFrom: {secretKeyRef: {name: aria-simulator-worker-runtime, key: DYNAMO_SECRET_KEY}}
          volumeMounts: [{name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true}]
      volumes:
        - name: secrets-store
          csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: aria-simulator-worker-secrets}}
