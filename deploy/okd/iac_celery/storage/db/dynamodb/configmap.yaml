apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-dynamodb-config
  labels: {app.kubernetes.io/name: dynamodb, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
data:
  SERVICES: dynamodb
  EAGER_SERVICE_LOADING: "1"
  LOCALSTACK_VOLUME_DIR: /tmp/localstack_data
  DISABLE_DNS: "1"
