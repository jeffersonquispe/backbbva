apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aria-simulator-worker-secrets
  labels: {app.kubernetes.io/name: simulator-worker, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  provider: openbao
  secretObjects:
    - secretName: aria-simulator-worker-runtime
      type: Opaque
      data:
        - objectName: EVENT_SIMULATOR_ARIA_API_TOKEN
          key: EVENT_SIMULATOR_ARIA_API_TOKEN
        - objectName: DYNAMO_ACCESS_KEY
          key: DYNAMO_ACCESS_KEY
        - objectName: DYNAMO_SECRET_KEY
          key: DYNAMO_SECRET_KEY
  parameters:
    roleName: aria-simulator-worker
    baoAddress: OPENBAO_URL_REPLACE_ME
    objects: |
      - objectName: EVENT_SIMULATOR_ARIA_API_TOKEN
        secretPath: secret/data/aria/workers/simulator-worker
        secretKey: EVENT_SIMULATOR_ARIA_API_TOKEN
      - objectName: DYNAMO_ACCESS_KEY
        secretPath: secret/data/aria/workers/simulator-worker
        secretKey: DYNAMO_ACCESS_KEY
      - objectName: DYNAMO_SECRET_KEY
        secretPath: secret/data/aria/workers/simulator-worker
        secretKey: DYNAMO_SECRET_KEY
