apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aria-mcp-secrets
  labels: {app.kubernetes.io/name: mcp, app.kubernetes.io/part-of: aria, app.kubernetes.io/managed-by: argocd}
spec:
  provider: openbao
  secretObjects:
    - secretName: aria-mcp-runtime
      type: Opaque
      data:
        - objectName: AWS_ACCESS_KEY_ID
          key: AWS_ACCESS_KEY_ID
        - objectName: AWS_SECRET_ACCESS_KEY
          key: AWS_SECRET_ACCESS_KEY
        - objectName: DYNAMO_ACCESS_KEY
          key: DYNAMO_ACCESS_KEY
        - objectName: DYNAMO_SECRET_KEY
          key: DYNAMO_SECRET_KEY
        - objectName: OBJECT_STORAGE_ACCESS_KEY
          key: OBJECT_STORAGE_ACCESS_KEY
        - objectName: OBJECT_STORAGE_SECRET_KEY
          key: OBJECT_STORAGE_SECRET_KEY
  parameters:
    roleName: aria-mcp
    baoAddress: OPENBAO_URL_REPLACE_ME
    objects: |
      - objectName: AWS_ACCESS_KEY_ID
        secretPath: secret/data/aria/mcp/storage
        secretKey: AWS_ACCESS_KEY_ID
      - objectName: AWS_SECRET_ACCESS_KEY
        secretPath: secret/data/aria/mcp/storage
        secretKey: AWS_SECRET_ACCESS_KEY
      - objectName: DYNAMO_ACCESS_KEY
        secretPath: secret/data/aria/mcp/storage
        secretKey: DYNAMO_ACCESS_KEY
      - objectName: DYNAMO_SECRET_KEY
        secretPath: secret/data/aria/mcp/storage
        secretKey: DYNAMO_SECRET_KEY
      - objectName: OBJECT_STORAGE_ACCESS_KEY
        secretPath: secret/data/aria/mcp/storage
        secretKey: OBJECT_STORAGE_ACCESS_KEY
      - objectName: OBJECT_STORAGE_SECRET_KEY
        secretPath: secret/data/aria/mcp/storage
        secretKey: OBJECT_STORAGE_SECRET_KEY
