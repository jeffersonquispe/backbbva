apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: objectstorage
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata: {labels: {app.kubernetes.io/name: minio, app.kubernetes.io/component: objectstorage, app.kubernetes.io/part-of: aria}}
    spec:
      serviceAccountName: aria-minio
      containers:
        - name: minio
          image: REGISTRY_REPLACE_ME/minio/minio:IMAGE_TAG_REPLACE_ME
          args: [server, /data]
          ports: [{name: http, containerPort: 9000}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          envFrom: [{configMapRef: {name: aria-minio-config}}]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: aria-minio-runtime, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: aria-minio-runtime, key: MINIO_ROOT_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true}
          startupProbe: {tcpSocket: {port: http}, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 20}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: minio-data}}
        - name: secrets-store
          csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: aria-minio-secrets}}
