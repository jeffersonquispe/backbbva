apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-dynamodb-config
  labels: {app.kubernetes.io/name: dynamodb, app.kubernetes.io/component: database, app.kubernetes.io/part-of: aria-storage, app.kubernetes.io/managed-by: argocd}
data:
  SERVICES: dynamodb
  EAGER_SERVICE_LOADING: "1"
  PERSISTENCE: "1"
  GATEWAY_LISTEN: 0.0.0.0:4566
  USE_SSL: "0"
  DNS_ADDRESS: "0"
  SKIP_SSL_CERT_DOWNLOAD: "1"
