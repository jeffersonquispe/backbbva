# Type checking is introduced layer by layer. src/domain and src/application
# are framework-free (CLAUDE.md), so they are the cheapest place to start.
# Widen `files` as each layer gets clean; the error count is ratcheted by
# scripts/lint_ratchet.py (baseline in .lint-baseline.json).
[mypy]
python_version = 3.11
files = src/domain, src/application
mypy_path = .
explicit_package_bases = True
ignore_missing_imports = True
follow_imports = silent
warn_unused_ignores = True
cache_dir = .cache/mypy_cache
