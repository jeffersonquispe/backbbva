apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-phoenix-config
  labels: {app.kubernetes.io/name: phoenix, app.kubernetes.io/part-of: aria-observability, app.kubernetes.io/managed-by: argocd}
data:
  # Trace retention in days (default one month). 0 = keep forever.
  # Retention is not a backup: back up the phoenix-db PVC separately.
  PHOENIX_RETENTION_DAYS: "30"
