apiVersion: v1
kind: ConfigMap
metadata:
  name: aria-worker-config
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/part-of: aria
    app.kubernetes.io/managed-by: argocd
data:
  # Container clock and business buckets (analyst matrix, metric rollups)
  # both follow Bogotá - see docs/OBSERVABILITY_STRATEGY.md.
  TZ: America/Bogota
  OPERATIONS_TIMEZONE: America/Bogota
  GENAI_ENVIRONMENT: development
  API_V0_STR: /api/v0
  COMPONENT_NAME: aria-worker
  DEFAULT_LOGGING_LEVEL: INFO
  DYNAMO_ENDPOINT: http://dynamodb:8000
  DYNAMO_REGION_NAME: us-east-1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_DEFAULT_QUEUE: default
  CELERY_TEST_QUEUE: test
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: us-east-1
  OBJECT_STORAGE_BUCKET: aria-reports
  DATASET_STORAGE_BACKEND: minio
  DATASET_STORAGE_BUCKET: datasets
  MODEL_STORAGE_BUCKET: models
  LLM_BACKEND: azure
  OPENAI_ENDPOINT: https://genai-lupitaasistente-work-llm-openai.openai.azure.com/
  OPENAI_VERSION: "2024-08-01-preview"
  PROFILING_BACKEND: deterministic
  PROFILING_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  CLASSIFICATION_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  ADVERSARIAL_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  DETECTOR_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  DETECTOR_ADVERSARIAL_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  ANALYST_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  EXECUTOR_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  REPORT_LLM_MODEL: asistentelupita-llm-work-agent-gpt52
  # LLM-judge (reasoning evaluation); empty = falls back to REPORT_LLM_MODEL.
  JUDGE_LLM_MODEL: ""
  EMBEDDING_MODEL: agentepqrs-llm-live-emebed-3-large
  # Namespace Collector (observability/otel-collector), the only OTLP boundary.
  OTEL_ENDPOINT: http://otel-collector:4317
  OTEL_CAPTURE_LLM_CONTENT: "false"
