apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [serviceaccount.yaml, deployment.yaml, service.yaml, networkpolicy.yaml]
# Provisioning files are copies of deploy/local/docker/observability/grafana/*
# (kustomize cannot load files outside this directory). Keep them in sync.
generatorOptions:
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: aria-observability
    app.kubernetes.io/managed-by: argocd
configMapGenerator:
  - name: aria-grafana-datasources
    files: [provisioning/datasources/datasources.yaml]
  - name: aria-grafana-dashboard-provider
    files: [provisioning/dashboards/dashboards.yaml]
  - name: aria-grafana-alerting
    files: [provisioning/alerting/aria-rules.yaml]
  - name: aria-grafana-dashboards
    files: [dashboards/llm-overview.json, dashboards/service-overview.json]
