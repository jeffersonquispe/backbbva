# Template only: NOT listed in kustomization.yaml (Argo CD never syncs it).
#   oc create secret generic aria-observability-minio-runtime --from-literal=S3_ACCESS_KEY=... --from-literal=S3_SECRET_KEY=...
# Tempo, Loki and the bucket-init Job read the same two keys.
apiVersion: v1
kind: Secret
metadata:
  name: aria-observability-minio-runtime
  labels: {app.kubernetes.io/name: observability-minio, app.kubernetes.io/part-of: aria-observability}
type: Opaque
stringData:
  S3_ACCESS_KEY: REPLACE_ME
  S3_SECRET_KEY: REPLACE_ME
