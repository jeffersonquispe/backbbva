apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: aria-observability, app.kubernetes.io/managed-by: argocd}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [nginx]}]}
      ports: [{protocol: TCP, port: 3000}]
