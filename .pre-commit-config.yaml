# Local gate mirroring the Jenkins `Lint` and `Architecture` stages.
# Install once: `pip install pre-commit && pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (ratcheted, see .lint-baseline.json)
        entry: python scripts/lint_ratchet.py ruff
        language: system
        pass_filenames: false
        types: [python]
      - id: architecture
        name: make test-architecture
        entry: make test-architecture
        language: system
        pass_filenames: false
        types: [python]
      - id: project-graph
        name: project graph is up to date (skipped without ../frontend_mockup)
        entry: make project-graph-check
        language: system
        pass_filenames: false
        files: ^(scripts/(build_project_graph\.py|ts_scan\.mjs|project_graph_curated\.json)|src/infrastructure/entrypoint/api/routers/|src/application/ports/local_auth_port\.py)
